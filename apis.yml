name: PrimeRevenue
description: >-
  PrimeRevenue is a global financial technology company providing working capital and B2B payment
  solutions through a bank-agnostic, ERP-integrated platform. Its offerings include Supply Chain
  Finance (buyers extend payment terms while suppliers are paid early), Receivables Finance (suppliers
  sell invoices for early payment without buyer disclosure), Dynamic Discounting (early payment at
  variable discount rates), and Payments as a Service (a modern B2B payment layer). The platform
  manages more than $25B in daily assets, has accelerated over 12.5M invoices, and supports 30+
  languages. PrimeRevenue does not publish a public developer portal or API documentation; this
  profile captures its corporate, security, and compliance surface. Backed by Battery Ventures.
